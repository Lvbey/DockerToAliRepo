name: Docker

run-name: "gdocker ${{ inputs.request_id }} ${{ inputs.image }}"

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Single image to mirror (empty means process images.txt)'
        required: false
        type: string
      platform:
        description: 'Optional target platform, e.g. linux/amd64'
        required: false
        type: string
      registry_provider:
        description: 'Destination registry provider'
        required: false
        type: choice
        options:
          - aliyun
          - tencent
        default: aliyun
      request_id:
        description: 'gdocker request ID used to match the workflow run'
        required: false
        type: string
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  ALIYUN_REGISTRY: "${{ vars.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ vars.ALIYUN_NAME_SPACE || 'lvbey' }}"
  ALIYUN_REGISTRY_USER: "${{ vars.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"
  TENCENT_REGISTRY: "${{ vars.TENCENT_REGISTRY || 'ccr.ccs.tencentyun.com' }}"
  TENCENT_NAMESPACE: "${{ vars.TENCENT_NAMESPACE }}"
  TENCENT_REGISTRY_USER: "${{ vars.TENCENT_REGISTRY_USER }}"
  TENCENT_REGISTRY_PASSWORD: "${{ secrets.TENCENT_REGISTRY_PASSWORD }}"

jobs:
  build:
    if: ${{ !inputs.image }}
    name: Pull images.txt and push to selected registry
    runs-on: ubuntu-latest
    steps:
      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Build and push images to selected registry
        env:
          REGISTRY_PROVIDER: ${{ inputs.registry_provider || 'aliyun' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REGISTRY_PROVIDER" == tencent ]]; then
            registry="${TENCENT_REGISTRY#https://}"; registry="${registry#http://}"
            namespace="${TENCENT_NAMESPACE:?Set repository variable TENCENT_NAMESPACE}"
            registry_user="${TENCENT_REGISTRY_USER:?Set repository variable TENCENT_REGISTRY_USER}"
            registry_password="${TENCENT_REGISTRY_PASSWORD:?Set repository secret TENCENT_REGISTRY_PASSWORD}"
          else
            registry="${ALIYUN_REGISTRY:?Set repository variable ALIYUN_REGISTRY}"
            registry="${registry#https://}"; registry="${registry#http://}"
            namespace="${ALIYUN_NAME_SPACE:?Set repository variable ALIYUN_NAME_SPACE}"
            registry_user="${ALIYUN_REGISTRY_USER:?Set repository variable ALIYUN_REGISTRY_USER}"
            registry_password="${ALIYUN_REGISTRY_PASSWORD:?Set repository secret ALIYUN_REGISTRY_PASSWORD}"
          fi
          printf '%s' "$registry_password" | docker login --username "$registry_user" --password-stdin "$registry"

          declare -A duplicate_images=()
          declare -A temp_map=()
          while IFS= read -r line || [[ -n "$line" ]]; do
            [[ -z "${line//[[:space:]]/}" || "$line" =~ ^[[:space:]]*# ]] && continue
            image=$(awk '{print $NF}' <<< "$line")
            image="${image%%@*}"
            image_name_tag="${image##*/}"
            name_space=""
            if [[ "$image" == */* ]]; then name_space="${image%/*}"; name_space="${name_space##*/}"; fi
            image_name="${image_name_tag%%:*}"
            if [[ -n "${temp_map[$image_name]:-}" && "${temp_map[$image_name]}" != "${name_space}_" ]]; then
              duplicate_images[$image_name]=true
            else
              temp_map[$image_name]="${name_space}_"
            fi
          done < images.txt

          SUCCESS=0
          FAIL=0
          while IFS= read -r line || [[ -n "$line" ]]; do
            [[ -z "${line//[[:space:]]/}" || "$line" =~ ^[[:space:]]*# ]] && continue
            read -r -a fields <<< "$line"
            image="${fields[-1]}"
            platform=""
            for ((i=0; i<${#fields[@]}; i++)); do
              if [[ "${fields[$i]}" == "--platform" && $((i+1)) -lt ${#fields[@]} ]]; then
                platform="${fields[$((i+1))]}"
              elif [[ "${fields[$i]}" == --platform=* ]]; then
                platform="${fields[$i]#--platform=}"
              fi
            done
            echo "Processing $image ${platform:+(platform $platform)}"
            if [[ -n "$platform" ]]; then
              docker pull --platform "$platform" "$image" || { echo "::warning::pull failed: $image"; FAIL=$((FAIL+1)); continue; }
            else
              docker pull "$image" || { echo "::warning::pull failed: $image"; FAIL=$((FAIL+1)); continue; }
            fi
            image_name_tag="${image##*/}"
            name_space=""
            if [[ "$image" == */* ]]; then name_space="${image%/*}"; name_space="${name_space##*/}"; fi
            image_name="${image_name_tag%%:*}"
            platform_prefix=""
            [[ -n "$platform" ]] && platform_prefix="${platform//\//_}_"
            name_space_prefix=""
            [[ -n "${duplicate_images[$image_name]:-}" && -n "$name_space" ]] && name_space_prefix="${name_space}_"
            new_image="$registry/$namespace/$platform_prefix$name_space_prefix$image_name_tag"
            if docker tag "$image" "$new_image" && docker push "$new_image"; then
              SUCCESS=$((SUCCESS+1))
            else
              echo "::warning::push failed: $new_image"
              FAIL=$((FAIL+1))
            fi
          done < images.txt
          echo "Summary: $SUCCESS succeeded, $FAIL failed"
          (( FAIL == 0 )) || exit 1

  mirror-one:
    if: ${{ inputs.image != '' }}
    name: Mirror one image for gdocker
    runs-on: ubuntu-latest
    steps:
      - name: Validate input and install skopeo
        env:
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_PLATFORM: ${{ inputs.platform }}
          REQUEST_ID: ${{ inputs.request_id }}
          REGISTRY_PROVIDER: ${{ inputs.registry_provider || 'aliyun' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REGISTRY_PROVIDER" == aliyun || "$REGISTRY_PROVIDER" == tencent ]] || { echo "Invalid registry_provider"; exit 2; }
          [[ -n "$REQUEST_ID" ]] || { echo "request_id is required"; exit 2; }
          [[ "$REQUEST_ID" =~ ^[a-zA-Z0-9-]{8,64}$ ]] || { echo "Invalid request_id"; exit 2; }
          [[ "$INPUT_IMAGE" != -* && "$INPUT_IMAGE" != *[[:space:]]* && "$INPUT_IMAGE" != *@* ]] || { echo "Use IMAGE[:TAG]; digest references are not supported yet"; exit 2; }
          [[ "$INPUT_IMAGE" =~ ^[a-zA-Z0-9._:/-]+$ ]] || { echo "Image contains unsupported characters"; exit 2; }
          if [[ -n "$INPUT_PLATFORM" && ! "$INPUT_PLATFORM" =~ ^[a-zA-Z0-9._-]+/[a-zA-Z0-9._-]+(/[a-zA-Z0-9._-]+)?$ ]]; then
            echo "Invalid platform; expected e.g. linux/amd64 or linux/arm64"; exit 2
          fi
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Mirror image to selected registry
        env:
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_PLATFORM: ${{ inputs.platform }}
          REGISTRY_PROVIDER: ${{ inputs.registry_provider || 'aliyun' }}
          REQUEST_ID: ${{ inputs.request_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REGISTRY_PROVIDER" == tencent ]]; then
            registry="${TENCENT_REGISTRY#https://}"; registry="${registry#http://}"
            namespace="${TENCENT_NAMESPACE:?Set repository variable TENCENT_NAMESPACE}"
            registry_user="${TENCENT_REGISTRY_USER:?Set repository variable TENCENT_REGISTRY_USER}"
            registry_password="${TENCENT_REGISTRY_PASSWORD:?Set repository secret TENCENT_REGISTRY_PASSWORD}"
          else
            registry="${ALIYUN_REGISTRY:?Set repository variable ALIYUN_REGISTRY}"
            registry="${registry#https://}"; registry="${registry#http://}"
            namespace="${ALIYUN_NAME_SPACE:?Set repository variable ALIYUN_NAME_SPACE}"
            registry_user="${ALIYUN_REGISTRY_USER:?Set repository variable ALIYUN_REGISTRY_USER}"
            registry_password="${ALIYUN_REGISTRY_PASSWORD:?Set repository secret ALIYUN_REGISTRY_PASSWORD}"
          fi
          image="$INPUT_IMAGE"
          [[ "${image##*/}" == *:* ]] || image="$image:latest"
          tag="${image##*:}"
          source_path="${image%:*}"
          first="${source_path%%/*}"
          if [[ "$source_path" != */* ]]; then
            source_registry="docker.io"; source_repo="library/$source_path"
          elif [[ "$first" == *.* || "$first" == *:* || "$first" == localhost ]]; then
            source_registry="$first"; source_repo="${source_path#*/}"
          else
            source_registry="docker.io"; source_repo="$source_path"
          fi
          source_registry="${source_registry,,}"; source_repo="${source_repo,,}"
          [[ "$source_registry" != index.docker.io ]] || source_registry=docker.io
          [[ "$source_registry" != docker.io || "$source_repo" == */* ]] || source_repo="library/$source_repo"
          source_image="$source_registry/$source_repo:$tag"

          # Use one namespace and encode upstream registry/path into one deterministic repository name.
          slug_registry="${source_registry//./-}"; slug_registry="${slug_registry//:/-}"
          slug_repo="${source_repo//\//-}"
          target_repo="$(printf '%s-%s' "$slug_registry" "$slug_repo" | sed -E 's/[^a-z0-9._-]+/-/g; s/[-_.]{2,}/-/g; s/^[-_.]+//; s/[-_.]+$//')"
          # ACR repository names are limited to 2-64 characters.
          if (( ${#target_repo} < 2 || ${#target_repo} > 64 )); then
            echo "Mapped repository name must be 2-64 characters for the selected registry: $target_repo"
            exit 2
          fi
          target_tag="$tag"
          if [[ -n "$INPUT_PLATFORM" ]]; then target_tag="${tag}--${INPUT_PLATFORM//\//-}"; fi
          (( ${#target_tag} <= 128 )) || { echo "Mapped image tag exceeds 128 characters"; exit 2; }
          target_image="$registry/$namespace/$target_repo:$target_tag"

          echo "Source image: $source_image"
          echo "Target image: $target_image"
          echo "Request ID: $REQUEST_ID"
          printf '%s' "$registry_password" | skopeo login --username "$registry_user" --password-stdin "$registry"
          if [[ -n "$INPUT_PLATFORM" ]]; then
            IFS=/ read -r os arch variant <<< "$INPUT_PLATFORM"
            copy_args=(--override-os "$os" --override-arch "$arch")
            [[ -z "${variant:-}" ]] || copy_args+=(--override-variant "$variant")
            skopeo copy "${copy_args[@]}" "docker://$source_image" "docker://$target_image"
          else
            skopeo copy --all "docker://$source_image" "docker://$target_image"
          fi
          skopeo inspect --raw "docker://$target_image" >/dev/null
          echo "Mirror succeeded: $target_image"
